<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="gradientB" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <rect width="100" height="100" rx="24" fill="#0a0f16" />
  
  <g filter="url(#glow)">
    <!-- Top lobe -->
    <path d="M 32 25 L 56 25 C 74 25 74 48 56 48 L 32 48" fill="none" stroke="url(#gradientB)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Bottom lobe -->
    <path d="M 32 48 L 62 48 C 82 48 82 75 62 75 L 32 75" fill="none" stroke="url(#gradientB)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Spine -->
    <line x1="32" y1="25" x2="32" y2="75" stroke="url(#gradientB)" stroke-width="10" stroke-linecap="round" />
  </g>
</svg>